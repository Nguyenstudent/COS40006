global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          server: production

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # The blackbox exporter fetches the app's health endpoint through the host's port 80.
  - job_name: app-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://host.docker.internal/api/health"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # The start page, for the brief's "95% of start-page requests in < 500 ms" metric.
  - job_name: app-page
    metrics_path: /probe
    params:
      module: [http_page]
    static_configs:
      - targets: ["http://host.docker.internal/vi"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
